# ExternalSecret: 从 Vault 注入敏感配置到 K8s Secret
# Vault 路径前缀: secret/data/sm/sm-legal-contract
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sm-legal-contract-externalsecret
  labels:
    app.kubernetes.io/name: sm-legal-contract
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: sm-legal-contract-secrets
    creationPolicy: Merge
  data:
    - secretKey: SM_INTERNAL_API_KEY
      remoteRef:
        key: sm/sm-legal-contract/internal-api-key
        property: value
    - secretKey: SM_DATABASE_URL
      remoteRef:
        key: sm/sm-legal-contract/database-url
        property: value
    - secretKey: SM_SM4_KEY_HEX
      remoteRef:
        key: sm/sm-legal-contract/sm4-key
        property: value
