# ConfigMap: 非敏感配置（环境变量）
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sm-legal-contract.fullname" . }}-config
  labels:
    {{- include "sm-legal-contract.commonLabels" . | nindent 4 }}
data:
  SM_ENV: {{ .Values.config.env | quote }}
  SM_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  SM_LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  SM_ALLOWED_HOSTS: {{ .Values.config.allowedHosts | quote }}
  SM_DATABASE_HOST: {{ .Values.config.databaseHost | quote }}
  SM_DATABASE_PORT: {{ .Values.config.databasePort | quote }}
  SM_DATABASE_NAME: {{ .Values.config.databaseName | quote }}
  SM_AUDIT_CENTER_URL: {{ .Values.config.auditCenterUrl | quote }}
