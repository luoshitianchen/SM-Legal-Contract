# Secret: 敏感字段仅放占位引用，真实值由 ExternalSecret 从 Vault 注入
# 此 Secret 模板不写明文，仅声明键名，运行时由 ExternalSecret Controller 回填
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sm-legal-contract.fullname" . }}-secrets
  labels:
    {{- include "sm-legal-contract.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  SM_INTERNAL_API_KEY: ""
  SM_DATABASE_URL: ""
  SM_SM4_KEY_HEX: ""
