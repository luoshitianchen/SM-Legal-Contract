# DEV 环境覆盖 values（通过 -f values-dev.yaml 合并）
replicaCount: 1

image:
  tag: "1.0.0"

config:
  env: dev
  logLevel: DEBUG
  logFormat: console
  databaseHost: "sm-legal-contract-pg"
  databaseName: "sm_legal_contract"
  allowedHosts: "sm-legal-contract.dev.sm.example.com,localhost"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4

ingress:
  enabled: false
  host: "sm-legal-contract.dev.sm.example.com"

