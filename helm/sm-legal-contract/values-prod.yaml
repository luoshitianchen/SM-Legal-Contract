# PROD 环境覆盖 values（通过 -f values-prod.yaml 合并）
replicaCount: 2

image:
  tag: "1.0.0"

config:
  env: prod
  logLevel: INFO
  logFormat: json
  databaseHost: "sm-legal-contract-pg"
  databaseName: "sm_legal_contract"
  allowedHosts: "sm-legal-contract.sm.example.com,localhost"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10

ingress:
  enabled: true
  host: "sm-legal-contract.sm.example.com"

# 数据库实例规格提示（prod）：主库+只读副本
