# STAGING 环境覆盖 values（通过 -f values-staging.yaml 合并）
replicaCount: 1

image:
  tag: "1.0.0"

config:
  env: staging
  logLevel: INFO
  logFormat: json
  databaseHost: "sm-legal-contract-pg"
  databaseName: "sm_legal_contract"
  allowedHosts: "sm-legal-contract.staging.sm.example.com,localhost"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4

ingress:
  enabled: true
  host: "sm-legal-contract.staging.sm.example.com"

