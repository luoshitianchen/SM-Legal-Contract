# 默认 values（所有环境共享基线）
# 资源 requests/limits 依据 benchmark-results.json（50 并发压测，uvicorn 进程约 80-120MB）
replicaCount: 2

image:
  repository: ghcr.io/luoshitianchen/sm-legal-contract
  tag: "1.0.0"
  pullPolicy: IfNotPresent

# 服务监听端口（与业务本地端口保持一致）
service:
  type: ClusterIP
  port: 8026
  targetPort: 8026
  protocol: TCP

# 环境变量映射
config:
  env: production
  logLevel: INFO
  logFormat: json
  databaseHost: "sm-legal-contract-pg"
  databasePort: "5432"
  databaseName: "sm_legal_contract"
  allowedHosts: "sm-legal-contract.sm.example.com,localhost"
  auditCenterUrl: "http://sm-audit-log-center.sm-prod.svc.cluster.local:8301"

# 资源配额（requests/limits）
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

# HPA 自动扩缩
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Ingress
ingress:
  enabled: true
  className: nginx
  host: "sm-legal-contract.sm.example.com"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

# 生命周期探针路径（与 FastAPI 路由约定一致）
probes:
  healthPath: /health
  readyPath: /readyz
  metricsPath: /metrics

# Pod 安全上下文（非 root、只读根文件系统）
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# 节点亲和/反亲和（尽量打散到不同节点）
affinity:
  podAntiAffinityEnabled: true
